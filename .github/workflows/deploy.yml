name: Deploy Backend to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR="/home/${{ secrets.VPS_USER }}/Canasta-BackEnd"

            # Si el proyecto no existe, lo clonamos
            if [ ! -d "$PROJECT_DIR" ]; then
              mkdir -p "$(dirname "$PROJECT_DIR")"
              git clone git@github.com:${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git pull origin main

            # Construir imagen y levantar contenedor leyendo el .env del servidor
            docker build -t canasta-backend:latest .
            docker stop canasta-backend-container 2>/dev/null || true
            docker rm canasta-backend-container 2>/dev/null || true
            docker run -d \
              --name canasta-backend-container \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file "./.env" \
              canasta-backend:latest
            docker ps --filter name=canasta-backend-container
