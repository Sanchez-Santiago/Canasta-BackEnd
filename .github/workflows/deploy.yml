name: Deploy Backend to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            PROJECT_DIR=~/Canasta-BackEnd

            # Si el proyecto no existe, lo clonamos
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone git@github.com:${{ github.repository }}.git $PROJECT_DIR
            fi

            cd $PROJECT_DIR
            git pull origin main

            # Construir imagen y levantar contenedor de forma limpia
            docker build -t canasta-backend .
            docker stop canasta-backend-container || true
            docker rm canasta-backend-container || true
            docker run -d --name canasta-backend-container --restart always -p 3000:3000 canasta-backend
