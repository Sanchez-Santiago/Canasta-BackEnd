info:
  name: CambiarContrasena
  type: http
  seq: 6
http:
  method: PATCH
  url: http://localhost:3000/auth/contrasena
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "contrasena_actual": "MiClaveActual1",
        "contrasena_nueva": "MiClaveNueva2!"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # PATCH `/auth/contrasena` (protegida)
  Cambia la propia clave. Verifica la actual (mal → 401), exige nueva
  distinta (igual → 400) y fuerte: mín 8, puntaje ≥ 3 (débil → 400 con
  `recomendaciones`). Responde `{ actualizado:true }`.
