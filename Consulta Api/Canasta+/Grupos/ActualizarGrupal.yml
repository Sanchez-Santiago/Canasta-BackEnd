info:
  name: ActualizarGrupal
  type: http
  seq: 5

http:
  method: PUT
  url: http://localhost:3000/grupos/17
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Compras del mes (editado)",
        "descripcion": "Nueva descripcion"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PUT `/grupos/:idGrupo` (protegida)
  Edita un grupo `grupal`. Solo `administrador` del grupo.
  El grupo `personal` NO se puede modificar (403).
