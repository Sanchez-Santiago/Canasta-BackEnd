  # DELETE `/grupos/:idGrupo/miembros/:idUsuario` (protegida)
  Expulsa a otro miembro del grupo. Solo admin, nunca del personal ni a si mismo.
  Cambiar los IDs por reales. Responde `{ eliminado:true }`.
