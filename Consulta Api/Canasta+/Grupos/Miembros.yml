info:
  name: Miembros
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/grupos/10/miembros
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET `/grupos/:idGrupo/miembros` (protegida)
  Lista todos los miembros del grupo remarcando el `rol` de cada usuario
  (`administrador` primero, luego por nombre). Solo visible si perteneces al grupo.
