info:
  name: VerGrupo
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/grupos/:idGrupo"
  params:
    - name: idGrupo
      value: "{{idGrupo}}"
      type: path
      description: ID del grupo (usa variable de entorno idGrupo)
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # GET `/grupos/:idGrupo` (protegida)
  Muestra el detalle del grupo con tu rol. Solo si perteneces al grupo.
