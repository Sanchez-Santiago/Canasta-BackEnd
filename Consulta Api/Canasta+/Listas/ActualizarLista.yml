info:
  name: ActualizarLista
  type: http
  seq: 4
http:
  method: PUT
  url: "{{baseUrl}}/listas/:idLista"
  params:
    - name: idLista
      value: "{{idLista}}"
      type: path
      description: ID de la lista (variable idLista)
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Super del finde (editada)",
        "descripcion": "Nueva descripcion"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # PUT `/listas/:idLista` (protegida)
  Edita nombre/descripcion/estado. Solo creador de la lista o admin del grupo.
  Actualiza `fecha_actualizacion` automaticamente.
