info:
  name: CambiarEstadoLista
  type: http
  seq: 5

http:
  method: PATCH
  url: http://localhost:3000/listas/3/estado
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "estado": "completada"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PATCH `/listas/:idLista/estado` (protegida)
  Cambia el estado: `activa` | `completada` | `archivada`.
  Solo creador de la lista o admin del grupo.
