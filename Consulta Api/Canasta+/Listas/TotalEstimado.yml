http:
  method: GET
  url: http://localhost:3000/listas/3/total-estimado
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET `/listas/:idLista/total-estimado` (protegida)
  Calcula el costo estimado: SUM(cantidad * precio_estimado_unitario).
  Devuelve `total_estimado_centavos`, `total_estimado_pesos` y conteos de items.
