info:
  name: TotalEstimado
  type: http
  seq: 6
http:
  method: GET
  url: "{{baseUrl}}/listas/:idLista/total-estimado"
  params:
    - name: idLista
      value: "{{idLista}}"
      type: path
      description: ID de la lista (variable idLista)
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # GET `/listas/:idLista/total-estimado` (protegida)
  Calcula el costo estimado: SUM(cantidad * precio_estimado_unitario).
  Devuelve `total_estimado_centavos`, `total_estimado_pesos` y conteos de items.
