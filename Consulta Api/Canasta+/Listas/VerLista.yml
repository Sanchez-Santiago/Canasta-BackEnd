info:
  name: VerLista
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/listas/:idLista"
  params:
    - name: idLista
      value: "{{idLista}}"
      type: path
      description: ID de la lista (variable idLista)
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # GET `/listas/:idLista` (protegida)
  Muestra el detalle de una lista. Solo si perteneces al grupo de la lista.
