info:
  name: ListarPorGrupo
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/grupos/6/movimientos
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET `/grupos/:idGrupo/movimientos` (protegida)
  Lista los movimientos del grupo ordenados por `fecha_movimiento` descendente.
  Filtro opcional: `?tipo=ingreso` o `?tipo=gasto`.
