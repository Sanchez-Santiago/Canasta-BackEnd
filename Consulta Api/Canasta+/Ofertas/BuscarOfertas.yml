info:
  name: BuscarOfertas
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/ofertas/buscar?producto=leche entera&limite=5&orden=2
  params:
    - name: producto
      value: leche entera
      type: query
    - name: limite
      value: "5"
      type: query
    - name: orden
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET `/ofertas/buscar` (protegida)

  Buscador **EN VIVO**: consulta Carrefour, Dia, Jumbo, MasOnline (API VTEX) y Promofy
  en paralelo. **No guarda nada** en la base y descarta las ofertas ya vencidas.

  Obligatorio: `producto` (2-100). Opcionales: `limite` (1-50, def. 10),
  `mercados` (CSV), `categoria`, `localidad`, `provincia`, `min_desc`, `min_precio`,
  `max_precio`, `orden` (1 descuento, 2 precio asc, 3 precio desc, 4 relevancia),
  `exacto`, `parecidos`, `agotados`, `solo_ofertas`.
