docs: |-
  # POST `/ofertas` (protegida)

  Alta manual de una oferta en el catalogo.

  **Obligatorios**: `fuente` (<=60), `producto` (2-300), `url` (URL valida).
  **Opcionales**: `comercio`, `producto_id`, precios (>= 0), `descuento_porc` (0-100),
  `ean` (solo digitos), `marca`, `categoria`, `categoria_ruta` (array), `detalle`,
  `precio_unidad`, `unidad_medida` (`kg`|`L`), `imagen_url`, `stock` (int >= 0),
  `disponible` (bool, def. true), `ubicacion`/`localidad`/`provincia`,
  `fecha_inicio`/`fecha_fin` (ISO; si vienen ambas, fin > inicio),
  `cuotas` (array), `reintegro`, `promos` (array), `tipo_promo`, `fecha_captura`.

  Los arrays se guardan como JSON en TEXT y vuelven ya parseados. Devuelve `201`.
