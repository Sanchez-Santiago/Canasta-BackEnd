info:
  name: ListarOfertas
  type: http
  seq: 2
http:
  method: GET
  url: http://localhost:3000/ofertas?vigentes=true&limite=20
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # GET `/ofertas` (protegida)

  Listado del catalogo guardado. Filtros opcionales: `fuente`, `comercio`, `ean`,
  `marca`, `categoria`, `producto` (parciales), `localidad`, `provincia`,
  `vigentes=true` (sin fin o fin futuro), `disponible=true|false`,
  `limite` (1-200, def. 50), `offset` (def. 0).

  Devuelve `{ ofertas: [...], total: N }`.
