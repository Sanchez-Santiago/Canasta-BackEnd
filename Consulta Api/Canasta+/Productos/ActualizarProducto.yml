info:
  name: ActualizarProducto
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:3000/productos-lista/3
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Leche (editada)",
        "cantidad": 3,
        "precio_estimado_unitario": 850,
        "prioridad": "prioritario"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PUT `/productos-lista/:idProductoLista` (protegida)
