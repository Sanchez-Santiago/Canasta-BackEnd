info:
  name: CambiarEstadoProducto
  type: http
  seq: 5

http:
  method: PATCH
  url: http://localhost:3000/productos-lista/3/estado
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "estado": "comprado"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PATCH `/productos-lista/:idProductoLista/estado` (protegida)
  Cambia el estado: `pendiente` | `comprado` | `omitido`.
  Cualquier miembro del grupo puede hacerlo.
