info:
  name: CrearProducto
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/listas/3/productos
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Leche",
        "descripcion": "Entera 1L",
        "prioridad": "esencial",
        "cantidad": 2,
        "precio_estimado_unitario": 800,
        "codigo_producto": "779000100",
        "unidad_medida": "botella",
        "marca": "La Serenísima",
        "categoria": "Lácteos",
        "estado": "pendiente"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # POST `/listas/:idLista/productos` (protegida)
  Agrega un producto a la lista. Cualquier miembro del grupo puede crearlo.
  `nombre` y `cantidad` (>0) obligatorios. Precio en centavos (entero >= 0).
  Prioridad: `prioritario` | `esencial` | `secundario` (default secundario).
  `unidad_medida` (compra) default `unidad`; `marca` y `categoria` opcionales.
  Tras crear, el backend busca ofertas con nombre+marca+categoria y las guarda:
  la respuesta trae `producto` + `ofertas`.
