info:
  name: ListarPorLista
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/listas/4/productos?marca=La%20Seren%C3%ADsima&categoria=L%C3%A1cteos
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET `/listas/:idLista/productos` (protegida)
  Lista los productos de una lista ordenados por prioridad
  (`prioritario` > `esencial` > `secundario`) y fecha.
  Filtros opcionales por query: `marca` y `categoria` (parciales),
  `unidad_medida` (exacta).
