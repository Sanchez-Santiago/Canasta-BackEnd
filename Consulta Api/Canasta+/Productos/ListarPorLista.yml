info:
  name: ListarPorLista
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/listas/:idLista/productos"
  params:
    - name: idLista
      value: "{{idLista}}"
      type: path
      description: ID de la lista (variable idLista)
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # GET `/listas/:idLista/productos` (protegida)
  Lista los productos de una lista ordenados por prioridad
  (`prioritario` > `esencial` > `secundario`) y fecha.
