info:
  name: ListarPorLista
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/listas/4/productos
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET `/listas/:idLista/productos` (protegida)
  Lista los productos de una lista ordenados por prioridad
  (`prioritario` > `esencial` > `secundario`) y fecha.
