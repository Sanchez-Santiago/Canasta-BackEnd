info:
  name: VerProducto
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/productos-lista/:idProductoLista"
  params:
    - name: idProductoLista
      value: "{{idProductoLista}}"
      type: path
      description: ID del producto (variable idProductoLista)
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  # GET `/productos-lista/:idProductoLista` (protegida)
  Muestra un producto. Solo si perteneces al grupo de su lista.
